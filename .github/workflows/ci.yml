name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run unit tests
        run: |
          export PYTHONPATH=$PWD
          pytest tests/ -v --tb=short

      - name: Check import of prediction service
        run: |
          export PYTHONPATH=$PWD
          python -c "from backend.app.services.prediction import risk_category; assert risk_category(0.1)=='low'"
