name: CI
on:
  push:
    branches: [main, feat/clinassist-full-stack-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: clinassist-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - run: PYTHONPATH=$PWD DATABASE_URL=sqlite:///./ci.db SECRET_KEY=ci-only-secret-key-not-for-deployment-123456 alembic upgrade head
      - run: PYTHONPATH=$PWD pytest tests/ -v --tb=short
      - run: PYTHONPATH=$PWD SECRET_KEY=ci-only-secret-key-not-for-deployment-123456 python -c "from backend.app.main import app; print(app.title)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
  research-benchmarks:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Record reproduction hardware and operating system
        run: |
          echo "=== Operating system ==="
          cat /etc/os-release
          echo "=== Kernel ==="
          uname -a
          echo "=== CPU ==="
          lscpu
          echo "=== Memory ==="
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          echo "=== Python ==="
          python3 --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Retrieve and validate public benchmark
        run: PYTHONPATH=$PWD python -m ml.datasets.download_pima
      - name: Run repeated synthetic-shift experiment
        run: PYTHONPATH=$PWD python -m ml.experiments.run_shift_study --repeats 5
      - name: Run TreeSHAP explanation stability experiment
        run: PYTHONPATH=$PWD python -m ml.experiments.run_explanation_stability --seed 42 --n-explain 100
      - name: Run subgroup and paired-bootstrap statistical audit
        timeout-minutes: 25
        run: |
          PYTHONPATH=$PWD python -m ml.experiments.run_subgroup_statistical_audit --bootstrap 1000 --seed 2026
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          root = Path("ml/artifacts/experiments")
          metrics_path = root / "subgroup_metrics.csv"
          bootstrap_path = root / "subgroup_paired_bootstrap.csv"
          assert metrics_path.is_file() and metrics_path.stat().st_size > 0
          assert bootstrap_path.is_file() and bootstrap_path.stat().st_size > 0

          metrics = pd.read_csv(metrics_path)
          bootstrap = pd.read_csv(bootstrap_path)
          assert not metrics.empty and not bootstrap.empty
          assert {"subgroup_type", "subgroup", "seed", "model", "shift_scenario",
                  "adaptation", "n", "events", "eligible_for_metrics"} <= set(metrics.columns)
          assert {"subgroup_type", "subgroup", "seed", "model", "shift_scenario",
                  "n", "events", "valid_replicates", "status",
                  "auroc_ci_lower", "auroc_ci_upper", "auprc_ci_lower",
                  "auprc_ci_upper", "brier_ci_lower", "brier_ci_upper"} <= set(bootstrap.columns)
          assert set(bootstrap["status"]) <= {"ok", "insufficient subgroup events"}
          successful = bootstrap[bootstrap["status"] == "ok"]
          assert (successful["valid_replicates"] >= 900).all()
          assert successful[["auroc_ci_lower", "auroc_ci_upper", "auprc_ci_lower",
                             "auprc_ci_upper", "brier_ci_lower", "brier_ci_upper"]].notna().all().all()
          assert (bootstrap["n"] >= 0).all()
          assert (bootstrap["events"] <= bootstrap["n"]).all()
          assert (metrics["events"] <= metrics["n"]).all()
          print({"metric_rows": len(metrics), "bootstrap_rows": len(bootstrap),
                 "successful_intervals": len(successful),
                 "explicitly_suppressed_sparse_rows": int((bootstrap["status"] == "insufficient subgroup events").sum())})
          PY
      - name: Commit reproducible seven-scenario shift-study outputs
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/datasets/pima_manifest.json
          git add -f \
            ml/artifacts/experiments/synthetic_shift_study.json \
            ml/artifacts/experiments/synthetic_shift_runs.csv \
            ml/artifacts/experiments/synthetic_shift_summary.csv \
            ml/artifacts/experiments/synthetic_shift_paired_differences.csv \
            ml/artifacts/experiments/synthetic_shift_predictions.csv
          if git diff --cached --quiet; then
            echo "No shift-study output changes to commit."
          else
            git commit -m "Add reproducible seven-scenario shift-study outputs"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Upload benchmark, predictions, and analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinassist-research-results
          path: |
            ml/datasets/pima_manifest.json
            ml/artifacts/experiments/
          if-no-files-found: warn
          retention-days: 90
