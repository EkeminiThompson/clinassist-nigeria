name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: clinassist-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - run: PYTHONPATH=$PWD DATABASE_URL=sqlite:///./ci.db SECRET_KEY=ci-only-secret-key-not-for-deployment-123456 alembic upgrade head
      - run: PYTHONPATH=$PWD pytest tests/ -v --tb=short
      - run: PYTHONPATH=$PWD SECRET_KEY=ci-only-secret-key-not-for-deployment-123456 python -c "from backend.app.main import app; print(app.title)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
