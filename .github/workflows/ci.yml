name: CI
on:
  push:
    branches: [main, feat/clinassist-full-stack-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: clinassist-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - run: PYTHONPATH=$PWD DATABASE_URL=sqlite:///./ci.db SECRET_KEY=ci-only-secret-key-not-for-deployment-123456 alembic upgrade head
      - run: PYTHONPATH=$PWD pytest tests/ -v --tb=short
      - run: PYTHONPATH=$PWD SECRET_KEY=ci-only-secret-key-not-for-deployment-123456 python -c "from backend.app.main import app; print(app.title)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
  research-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Retrieve and validate public benchmark
        run: PYTHONPATH=$PWD python -m ml.datasets.download_pima
      - name: Run repeated synthetic-shift experiment
        run: PYTHONPATH=$PWD python -m ml.experiments.run_shift_study --repeats 5
      - name: Run TreeSHAP explanation stability experiment
        run: PYTHONPATH=$PWD python -m ml.experiments.run_explanation_stability --seed 42 --n-explain 100
      - name: Run subgroup and paired-bootstrap statistical audit
        run: |
          PYTHONPATH=$PWD python -m ml.experiments.run_subgroup_statistical_audit --bootstrap 1000 --seed 2026
          test -s ml/artifacts/experiments/subgroup_metrics.csv
          test -s ml/artifacts/experiments/subgroup_paired_bootstrap.csv
      - name: Upload benchmark, predictions, and analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinassist-research-results
          path: |
            ml/datasets/pima_manifest.json
            ml/artifacts/experiments/
          if-no-files-found: warn
          retention-days: 90
